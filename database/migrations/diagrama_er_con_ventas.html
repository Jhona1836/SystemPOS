
<style>
#erd { width: 100%; overflow-x: auto; }
#erd svg { max-width: 100%; }
.legend { display: flex; gap: 20px; flex-wrap: wrap; margin: 12px 0 4px; font-size: 12px; color: var(--color-text-secondary); }
.legend-item { display: flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Diagrama entidad-relación completo con módulo de ventas, ticket y catálogos</h2>
<div class="legend">
  <span class="legend-item"><span class="dot" style="background:#534AB7"></span> Usuarios / Auth</span>
  <span class="legend-item"><span class="dot" style="background:#0F6E56"></span> Ventas</span>
  <span class="legend-item"><span class="dot" style="background:#854F0B"></span> Catálogo</span>
  <span class="legend-item"><span class="dot" style="background:#185FA5"></span> Permisos</span>
</div>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#085041' : '#E1F5EE',
    primaryBorderColor: dark ? '#1D9E75' : '#0F6E56',
    primaryTextColor: dark ? '#9FE1CB' : '#04342C',
    secondaryColor: dark ? '#2a2865' : '#EEEDFE',
    secondaryBorderColor: dark ? '#534AB7' : '#7F77DD',
    secondaryTextColor: dark ? '#c2c0b6' : '#26215C',
    tertiaryColor: dark ? '#412402' : '#FAEEDA',
    tertiaryBorderColor: dark ? '#854F0B' : '#BA7517',
    tertiaryTextColor: dark ? '#FAC775' : '#412402',
  },
});

const diagram = `erDiagram

  business_info {
    bigint id PK
    string razon_social
    string rfc
    string direccion
    string telefono
    string email
    string logo_path
    timestamp created_at
    timestamp updated_at
  }

  payment_methods {
    bigint id PK
    string nombre
    boolean activo
    timestamp created_at
    timestamp updated_at
  }

  sales {
    bigint id PK
    string folio
    bigint user_id FK
    bigint payment_method_id FK
    decimal subtotal
    decimal iva_total
    decimal total
    decimal monto_recibido
    decimal cambio
    enum estado
    text notas
    timestamp created_at
    timestamp updated_at
  }

  sale_items {
    bigint id PK
    bigint sale_id FK
    bigint product_id FK
    string producto_nombre
    string producto_sku
    int cantidad
    decimal precio_unitario
    decimal iva_rate
    decimal iva_monto
    decimal subtotal
    timestamp created_at
  }

  users {
    bigint id PK
    string name
    string email
    string pin
    boolean activo
    timestamp ultimo_accesso
  }

  categories {
    bigint id PK
    string nombre
    text descripcion
    boolean activo
  }

  products {
    bigint id PK
    string sku
    string codigoBarras
    string nombre
    decimal precioVenta
    decimal precioCosto
    int stock
    int stockMinimo
    enum unidad
    enum iva
    boolean activo
    bigint category_id FK
  }

  roles {
    bigint id PK
    string name
    string guard_name
  }

  permissions {
    bigint id PK
    string name
    string guard_name
  }

  model_has_roles {
    bigint role_id FK
    string model_type
    bigint model_morph_key FK
  }

  model_has_permissions {
    bigint permission_id FK
    string model_type
    bigint model_morph_key FK
  }

  role_has_permissions {
    bigint permission_id FK
    bigint role_id FK
  }

  users ||--o{ sales : "realiza"
  payment_methods ||--o{ sales : "se usa en"
  sales ||--|{ sale_items : "contiene"
  products ||--o{ sale_items : "aparece en"
  categories ||--o{ products : "agrupa"
  users ||--o{ model_has_roles : "tiene"
  roles ||--o{ model_has_roles : "asignado en"
  roles ||--o{ role_has_permissions : "tiene"
  permissions ||--o{ role_has_permissions : "asignada en"
  permissions ||--o{ model_has_permissions : "asignada en"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
